# Render Blueprint for the MemeCapes game server (server/ folder). See server/README.md.
services:
  - type: web
    name: memecapes-server
    runtime: node
    rootDir: server
    plan: starter
    region: ohio
    buildCommand: "echo nothing to build"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_NAMES
        sync: false
      - key: CAPES_MINT          # the $CAPEZ mint address once the token exists; empty = holder perks off
        sync: false
      - key: HOLDER_PCT
        value: "1"
      - key: HOLDER_DAYS
        value: "14"
      - key: PARTNER_PCT
        value: "3"
      - key: PARTNER_DAYS
        value: "14"
      - key: BURN_PCT
        value: "1"
      - key: BURN_AD_DAYS
        value: "0"
      - key: LP_PARTNER         # launchpad fee wallet (public address); empty = the one in config.js
        sync: false
      - key: MEMESNAKE_KEY      # the key the MemeSnake agent posts its live feed with (memesnake.html); you make it up
        sync: false
      - key: GUARD_WEBHOOK      # Sentinel alerts: a Discord webhook URL (optional)
        sync: false
      - key: GUARD_TG_TOKEN     # Sentinel alerts to Telegram: bot token (optional)
        sync: false
      - key: GUARD_TG_CHAT      # ...and the chat id to post in
        sync: false
      - key: CF_ACCOUNT_ID      # Cloudflare Stream, for live video on Watch/Stream; empty = video off, the rest works
        sync: false
      - key: CF_STREAM_TOKEN
        sync: false
      - key: CF_CUSTOMER_CODE
        sync: false
    disk:
      name: memecapes-data
      mountPath: /var/data
      sizeGB: 1
