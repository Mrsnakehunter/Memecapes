<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
// Bag-icon renderer: a static mesh (from armcut.py or a weapon model), clipped per pixel by its keep field (kb),
// transparent background, key light top-left, warm rim light, dark hollow inside.
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:true,premultipliedAlpha:false,alpha:true});
gl.getExtension('OES_element_index_uint');gl.getExtension('OES_standard_derivatives');
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const pg=gl.createProgram();
gl.attachShader(pg,sh(gl.VERTEX_SHADER,'attribute vec3 p,n;attribute vec2 uv;attribute float k;uniform mat4 M,Vw;varying vec3 vn,vp;varying vec2 vu;varying float vk;void main(){vn=(Vw*vec4(n,0.)).xyz;vp=(Vw*vec4(p,1.)).xyz;vu=uv;vk=k;gl_Position=M*vec4(p,1.);}'));
gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,'precision highp float;varying vec3 vn,vp;varying vec2 vu;varying float vk;uniform sampler2D tx;uniform float ht,sat,expo;uniform vec3 col;void main(){if(vk<0.)discard;vec3 n=normalize(vn);bool ff=gl_FrontFacing;if(!ff)n=-n;vec3 c=ht>.5?texture2D(tx,vu).rgb:col;float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,sat);vec3 V=normalize(-vp);vec3 L=normalize(vec3(-.6,.8,.55));float d=max(dot(n,L),0.);float hv=max(dot(n,normalize(L+V)),0.);float sp=pow(hv,40.)*.55+pow(hv,8.)*.12;float rim=pow(1.-max(dot(n,V),0.),3.);vec3 F=normalize(vec3(.7,.2,.5));float fill=max(dot(n,F),0.)*.25;vec3 o=c*(.30+1.0*d+fill)+vec3(sp)*(.6+.4*l)+rim*vec3(1.,.9,.7)*.55;o*=expo;if(!ff)o=c*.32;gl_FragColor=vec4(o,1.);}'));
gl.bindAttribLocation(pg,0,'p');gl.bindAttribLocation(pg,1,'n');gl.bindAttribLocation(pg,2,'uv');gl.bindAttribLocation(pg,3,'k');
gl.linkProgram(pg);gl.useProgram(pg);const U={};['M','Vw','tx','ht','col','sat','expo'].forEach(k=>U[k]=gl.getUniformLocation(pg,k));
const dec=(s,T)=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)};
function mul4(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o}
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0])}
function look(e,c){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z);z=z.map(v=>v/l);let x=[z[2],0,-z[0]];l=Math.hypot(...x);x=x.map(v=>v/l);const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1])}
function buf(a,loc,n){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);gl.vertexAttribPointer(loc,n,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(loc)}
// job: {url, yaw, pitch, dist, fov, rx (tilt about view axis), sat, expo}
window.render=async function(j){const d=await (await fetch(j.url)).json();
 let V=Float32Array.from(dec(d.vb,Int16Array),x=>x/1000),N=Float32Array.from(dec(d.nb,Int8Array),x=>x/127),UV=Float32Array.from(dec(d.ub,Uint16Array),x=>x/65535),I=dec(d.ib,Uint16Array);
 const K=d.kb?Float32Array.from(dec(d.kb,Int16Array),x=>x/1e5):new Float32Array(V.length/3).fill(1);
 if(j.ctr){for(let v=0;v<V.length;v+=3){V[v]-=j.ctr[0];V[v+1]-=j.ctr[1];V[v+2]-=j.ctr[2]}}
 if(j.rot){const R=j.rot;const tr=(A)=>{for(let v=0;v<A.length;v+=3){const x=A[v],y=A[v+1],z=A[v+2];A[v]=R[0]*x+R[1]*y+R[2]*z;A[v+1]=R[3]*x+R[4]*y+R[5]*z;A[v+2]=R[6]*x+R[7]*y+R[8]*z}};tr(V);tr(N)}
 let tex=null;if(d.tex)await new Promise(r=>{const im=new Image();im.onload=()=>{tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);r()};im.onerror=r;im.src=d.tex});
 const W=cv.width,H=cv.height;gl.viewport(0,0,W,H);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const e=[Math.sin(j.yaw)*Math.cos(j.pitch)*j.dist,Math.sin(j.pitch)*j.dist,Math.cos(j.yaw)*Math.cos(j.pitch)*j.dist];
 const VW=look(e,[0,0,0]);gl.uniformMatrix4fv(U.Vw,false,VW);gl.uniformMatrix4fv(U.M,false,mul4(persp(j.fov||.5,1,.05,100),VW));
 buf(V,0,3);buf(N,1,3);buf(UV,2,2);buf(K,3,1);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,I,gl.STATIC_DRAW);
 gl.uniform1f(U.ht,tex?1:0);gl.uniform3fv(U.col,[.8,.8,.8]);gl.uniform1f(U.sat,j.sat||1.15);gl.uniform1f(U.expo,j.expo||1.05);if(tex)gl.bindTexture(gl.TEXTURE_2D,tex);
 gl.drawElements(gl.TRIANGLES,I.length,gl.UNSIGNED_SHORT,0);return 'ok'};
window.ready=1;
</script></body></html>
